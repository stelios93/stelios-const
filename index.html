<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stelios Constantinidis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080808;
    overflow: hidden;
    height: 100vh;
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: flex-end;
    gap: 2rem;
  }

  nav a {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(200, 196, 190, 0.45);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  nav a:hover {
    color: #e8e4de;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<nav>
  <a href="about.html">About</a>
  <a href="blog.html">Blog</a>
</nav>

<canvas id="c"></canvas>

<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let w, h, time = 0;
  let particles = [];
  const PHI = (1 + Math.sqrt(5)) / 2;

  function resize() {
    const dpr = devicePixelRatio;
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init() {
    resize();
    particles = [];
    const count = Math.floor((innerWidth * innerHeight) / 3000);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.12,
        vy: (Math.random() - 0.5) * 0.12,
        phase: Math.random() * Math.PI * 2,
        freq: Math.random() * 0.003 + 0.0008,
      });
    }
  }

  // logarithmic spiral tendril
  function drawTendril(ox, oy, startAngle, length, curl, thickness, hue, sat, light, alpha, phase) {
    ctx.beginPath();
    const steps = 150;
    let prevX, prevY;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const angle = startAngle + t * curl + Math.sin(t * 6 + phase) * 0.4;
      const r = t * length * (1 + Math.sin(t * 4 + phase * 0.7) * 0.15);
      const wobble = Math.sin(t * 12 + phase * 2) * t * 8;
      const x = ox + Math.cos(angle) * r + Math.cos(angle + Math.PI / 2) * wobble;
      const y = oy + Math.sin(angle) * r + Math.sin(angle + Math.PI / 2) * wobble;
      if (i === 0) { ctx.moveTo(x, y); }
      else { ctx.lineTo(x, y); }
      prevX = x; prevY = y;
    }
    const fade = alpha * (0.7 + Math.sin(phase) * 0.3);
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${fade})`;
    ctx.lineWidth = thickness;
    ctx.lineCap = 'round';
    ctx.stroke();

    // iridescent shimmer along the tendril — second pass with shifted hue
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const angle = startAngle + t * curl + Math.sin(t * 6 + phase) * 0.4;
      const r = t * length * (1 + Math.sin(t * 4 + phase * 0.7) * 0.15);
      const wobble = Math.sin(t * 12 + phase * 2) * t * 8;
      const x = ox + Math.cos(angle) * r + Math.cos(angle + Math.PI / 2) * wobble;
      const y = oy + Math.sin(angle) * r + Math.sin(angle + Math.PI / 2) * wobble;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `hsla(${hue + 120}, ${sat + 15}%, ${light + 5}%, ${fade * 0.15})`;
    ctx.lineWidth = thickness * 2.5;
    ctx.stroke();
  }

  // spiraling organic body — more curved, fibonacci-like
  function spiralForm(cx, cy, radius, arms, phase, twist) {
    ctx.beginPath();
    const steps = 300;
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      // fibonacci-derived petal curves
      const petal = Math.pow(Math.abs(Math.sin(a * arms * 0.5 + phase)), 0.6) *
                    Math.sign(Math.sin(a * arms * 0.5 + phase));
      const spiral = Math.sin(a * arms + phase + a * twist) * 0.35;
      const fold = Math.sin(a * (arms * PHI) - phase * 0.8) * 0.2;
      const curl = Math.cos(a * (arms + 2) * PHI + phase * 1.2) * 0.12;
      const r = radius * (0.7 + petal * 0.4 + spiral + fold + curl);
      const x = cx + Math.cos(a + Math.sin(a * 3 + phase) * 0.15) * r;
      const y = cy + Math.sin(a + Math.cos(a * 2 + phase) * 0.15) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function draw() {
    const cw = innerWidth;
    const ch = innerHeight;
    ctx.clearRect(0, 0, cw, ch);

    // deep background
    const bg = ctx.createRadialGradient(cw * 0.5, ch * 0.45, 0, cw * 0.5, ch * 0.45, cw * 0.85);
    bg.addColorStop(0, '#120a10');
    bg.addColorStop(0.4, '#0a0808');
    bg.addColorStop(1, '#050404');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cw, ch);

    const scale = Math.min(cw, ch);

    // spiraling organic bodies — the shimmer forms
    const forms = [
      { cx: 0.38, cy: 0.42, r: 0.28, arms: 5,  twist: 1.2, speed: 0.04, hue: 280, sat: 30, light: 18, alpha: 0.25 },
      { cx: 0.6,  cy: 0.52, r: 0.22, arms: 8,  twist: 0.8, speed: 0.06, hue: 320, sat: 25, light: 20, alpha: 0.22 },
      { cx: 0.48, cy: 0.35, r: 0.32, arms: 3,  twist: 1.5, speed: 0.03, hue: 200, sat: 35, light: 16, alpha: 0.2  },
      { cx: 0.52, cy: 0.58, r: 0.18, arms: 13, twist: 0.6, speed: 0.08, hue: 340, sat: 28, light: 22, alpha: 0.28 },
      { cx: 0.44, cy: 0.48, r: 0.38, arms: 5,  twist: 2.0, speed: 0.025,hue: 260, sat: 40, light: 14, alpha: 0.18 },
      { cx: 0.55, cy: 0.4,  r: 0.14, arms: 21, twist: 0.4, speed: 0.1,  hue: 30,  sat: 45, light: 24, alpha: 0.3  },
    ];

    for (const f of forms) {
      const phase = time * f.speed;
      const cx = cw * f.cx + Math.sin(phase * 0.7 + f.arms) * 18;
      const cy = ch * f.cy + Math.cos(phase * 0.5 + f.arms * 0.7) * 14;
      const r = scale * f.r;
      const pulse = f.alpha + Math.sin(phase * 1.3) * 0.05;

      // outer glow
      spiralForm(cx, cy, r * 1.2, f.arms, phase, f.twist);
      ctx.fillStyle = `hsla(${f.hue}, ${f.sat}%, ${f.light * 0.5}%, ${pulse * 0.2})`;
      ctx.fill();

      // main body with gradient
      spiralForm(cx, cy, r, f.arms, phase, f.twist);
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, `hsla(${f.hue + 20}, ${f.sat + 10}%, ${f.light + 10}%, ${pulse})`);
      grad.addColorStop(0.5, `hsla(${f.hue}, ${f.sat}%, ${f.light}%, ${pulse * 0.6})`);
      grad.addColorStop(1, `hsla(${f.hue - 10}, ${f.sat - 5}%, ${f.light - 4}%, 0)`);
      ctx.fillStyle = grad;
      ctx.fill();

      // iridescent edge — shifted hue for prismatic effect
      spiralForm(cx, cy, r, f.arms, phase, f.twist);
      ctx.strokeStyle = `hsla(${f.hue + 60}, ${f.sat + 10}%, ${f.light + 20}%, ${pulse * 0.25})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // spiraling tendrils — curling outward from center like mutating vines
    const tendrils = [
      { ox: 0.45, oy: 0.45, angle: 0,        curl: 4.5, len: 0.35, thick: 1.2, hue: 290, sat: 35, light: 35, alpha: 0.18 },
      { ox: 0.5,  oy: 0.5,  angle: Math.PI*0.6, curl: -3.8, len: 0.3, thick: 0.8, hue: 200, sat: 40, light: 40, alpha: 0.15 },
      { ox: 0.48, oy: 0.42, angle: Math.PI*1.2, curl: 5.2, len: 0.28, thick: 1.0, hue: 330, sat: 30, light: 32, alpha: 0.16 },
      { ox: 0.52, oy: 0.55, angle: Math.PI*0.3, curl: -4.0, len: 0.32, thick: 0.9, hue: 260, sat: 38, light: 38, alpha: 0.14 },
      { ox: 0.42, oy: 0.5,  angle: Math.PI*1.7, curl: 3.5, len: 0.25, thick: 0.7, hue: 180, sat: 35, light: 36, alpha: 0.13 },
      { ox: 0.55, oy: 0.43, angle: Math.PI*0.9, curl: -5.0, len: 0.3, thick: 1.1, hue: 350, sat: 32, light: 30, alpha: 0.17 },
      { ox: 0.5,  oy: 0.47, angle: Math.PI*1.5, curl: 4.2, len: 0.2, thick: 0.6, hue: 40,  sat: 45, light: 42, alpha: 0.15 },
    ];

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const t of tendrils) {
      const phase = time * 0.3 + t.angle;
      const ox = cw * t.ox + Math.sin(phase * 0.4) * 10;
      const oy = ch * t.oy + Math.cos(phase * 0.3) * 8;
      const len = scale * t.len;
      drawTendril(ox, oy, t.angle + Math.sin(time * 0.1) * 0.3, len, t.curl, t.thick, t.hue, t.sat, t.light, t.alpha, phase);
    }
    ctx.restore();

    // fine spiraling filaments — like refracted light through the shimmer
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let s = 0; s < 5; s++) {
      ctx.beginPath();
      const centerX = cw * 0.5 + Math.sin(time * 0.15 + s * 1.3) * 40;
      const centerY = ch * 0.47 + Math.cos(time * 0.12 + s * 0.9) * 30;
      const spiralArms = 60;
      for (let i = 0; i < spiralArms; i++) {
        const t = i / spiralArms;
        const goldenAngle = i * Math.PI * 2 * PHI + time * 0.08 + s * Math.PI * 0.4;
        const r = t * scale * 0.35;
        const x = centerX + Math.cos(goldenAngle) * r;
        const y = centerY + Math.sin(goldenAngle) * r;
        ctx.moveTo(x, y);
        ctx.arc(x, y, 0.5 + t * 1.5, 0, Math.PI * 2);
      }
      const hue = 240 + s * 30 + Math.sin(time * 0.5 + s) * 20;
      ctx.fillStyle = `hsla(${hue}, 40%, 50%, 0.04)`;
      ctx.fill();
    }
    ctx.restore();

    // drifting spores
    for (const p of particles) {
      p.x += p.vx + Math.sin(time * p.freq + p.phase) * 0.3;
      p.y += p.vy + Math.cos(time * p.freq * 0.7 + p.phase) * 0.25;
      if (p.x < -10) p.x = cw + 10;
      if (p.x > cw + 10) p.x = -10;
      if (p.y < -10) p.y = ch + 10;
      if (p.y > ch + 10) p.y = -10;
      const flicker = 0.2 + Math.sin(time * 2 + p.phase) * 0.12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      const pH = (p.phase / (Math.PI * 2)) * 360;
      ctx.fillStyle = `hsla(${pH}, 25%, 65%, ${flicker})`;
      ctx.fill();
    }

    time += 0.016;
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>

</body>
</html>
